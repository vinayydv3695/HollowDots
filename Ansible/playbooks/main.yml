- hosts: localhost
  vars:
    personal: "{{ lookup('env', 'HOME') }}/personal"
    docker_user: "{{ lookup('env', 'USER') }}"
    user_home: "{{ lookup('env', 'HOME') }}"
    sdkman_user: "{{ lookup('env', 'USER') }}"
  pre_tasks:
    - name: Update Pacman repositories
      become: true
      pacman:
        update_cache: yes

  tasks:
    - name: Include Yay tasks
      include_tasks: ../roles/arch_hypr/tasks/yay.yml
      tags:
        - aur
        - yay

    #    - name: Include Chaotic AUR tasks
    #      include_tasks: ../roles/arch_hypr/tasks/chaotic-aur.yml
    #      tags:
    #        - aur
    #        - chaotic-aur

    - name: Include ZSH tasks
      include_tasks: ../roles/arch_hypr/tasks/zsh.yml
      tags:
        - zsh

    - name: Include Fonts tasks
      include_tasks: ../roles/arch_hypr/tasks/fonts.yml
      tags:
        - fonts

    - name: Include Hyprland Utils tasks
      include_tasks: ../roles/arch_hypr/tasks/hyprland-utils.yml
      tags:
        - hyprland-utils

    - name: Include Audio tasks
      include_tasks: ../roles/arch_hypr/tasks/audio.yml
      tags:
        - audio

    - name: Include Bluetooth tasks
      include_tasks: ../roles/arch_hypr/tasks/bluetooth.yml
      tags:
        - bluetooth

    - name: Include Brave tasks
      include_tasks: ../roles/arch_hypr/tasks/brave.yml
      tags:
        - brave

    - name: Include Firefox tasks
      include_tasks: ../roles/arch_hypr/tasks/firefox.yml
      tags:
        - firefox

    - name: Include Dev Deps
      include_tasks: ../roles/arch_hypr/tasks/dev.yml
      tags:
        - dev

    - name: Include Docker tasks
      include_tasks: ../roles/arch_hypr/tasks/docker.yml
      tags:
        - docker

    - name: Include Node tasks
      include_tasks: ../roles/arch_hypr/tasks/node.yml
      tags:
        - node

    - name: Include Java tasks
      include_tasks: ../roles/arch_hypr/tasks/java.yml
      tags:
        - java

    - name: Include Rust tasks
      include_tasks: ../roles/arch_hypr/tasks/rust.yml
      tags:
        - rust

    - name: Include Neovim tasks
      include_tasks: ../roles/arch_hypr/tasks/neovim.yml
      tags:
        - neovim

    - name: Include Syncthing tasks
      include_tasks: ../roles/arch_hypr/tasks/syncthing.yml
      tags:
        - syncthing

    - name: Include Tmux tasks
      include_tasks: ../roles/arch_hypr/tasks/tmux.yml
      tags:
        - tmux

    - name: Include Dual Boot tasks
      include_tasks: ../roles/arch_hypr/tasks/dual_boot.yml
      tags:
        - dual-boot

    - name: Include Apps tasks
      include_tasks: ../roles/arch_hypr/tasks/apps.yml
      tags:
        - apps
